# Alembic sozlamalari. Baza manzili .env dagi DATABASE_URL dan olinadi (migrations/env.py).
#
# Ko'p ishlatiladigan buyruqlar (backend papkasida, venv faol holatda):
#   alembic upgrade head                           # barcha migratsiyalarni qo'llash
#   alembic current                                # joriy versiya
#   alembic revision --autogenerate -m "izoh"      # modeldagi o'zgarishdan yangi migratsiya
#   alembic downgrade -1                           # oxirgi migratsiyani bekor qilish

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
